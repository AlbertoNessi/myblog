
{% load static %}

<!DOCTYPE html>
	<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>{% block title %}Alberto Nessi {% endblock %}</title>
		
		<link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
		
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
	</head>
	<body class="{% block body_class %}{% endblock %}">
		<header>
			<div class="nav-shell">
				<input type="checkbox" id="nav-toggle" class="nav-toggle">
				<label for="nav-toggle" class="nav-toggle-label" aria-label="Open menu">
					<span></span>
				</label>
				<nav class="site-nav current-nav" aria-label="Current page">
					<a href="/" class="home_menu_item">HOME</a>
					<a href="{% url 'now' %}" class="now_menu_item">NOW</a>
					<a href="{% url 'reading' %}" class="reading_menu_item">READING</a>
					<a href="{% url 'quotes' %}" class="quotes_menu_item">QUOTES</a>
				</nav>
				<nav class="site-nav menu-nav" aria-label="Site menu">
					<a href="/" class="home_menu_item">HOME</a>
					<a href="{% url 'now' %}" class="now_menu_item">NOW</a>
					<a href="{% url 'reading' %}" class="reading_menu_item">READING</a>
					<a href="{% url 'quotes' %}" class="quotes_menu_item">QUOTES</a>
				</nav>
				<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color mode">
					<svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79"></path>
					</svg>
					<svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<circle cx="12" cy="12" r="4"></circle>
						<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
					</svg>
				</button>
			</div>
		</header>
		{% block main_content %}{% endblock %}
		<footer style="display: block; width: 100%;">
			<div style="text-align: center">
				<small>&copy; {{ now|date:"Y" }} Alberto Nessi</small>
			</div>
		</footer>  
	</body>
	<script src="{% static 'blog/js/change_colors.js' %}"></script>
	<script src="{% static 'blog/js/tooltip.js' %}"></script>
</html>
